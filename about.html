<style>
#hd-layer{pointer-events:none}#hd-layer>*{pointer-events:auto}#hd-layer>[aria-hidden="true"]{pointer-events:none}
html,body{overscroll-behavior:none;margin:0;background:#EBE9E5;overflow-x:clip}
body{font-family:'Host Grotesk','Helvetica Neue',Helvetica,Arial,sans-serif;color:#17181B;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}a:hover{opacity:.8}
a:focus-visible,button:focus-visible{outline:2px solid #17181B;outline-offset:3px}
@keyframes hdRise{from{transform:translateY(50px);opacity:0}to{transform:none;opacity:1}}
@keyframes marquee{from{transform:translateX(0)}to{transform:translateX(-50%)}}
.hd-rise{animation:hdRise 1.2s cubic-bezier(.2,.75,.1,1) both}
.hd-d1{animation-delay:.15s}.hd-d2{animation-delay:.3s}
.marquee{animation:marquee 70s linear infinite}
.marquee-wrap:hover .marquee{animation-play-state:paused}
@media (prefers-reduced-motion: reduce){.hd-rise,.marquee{animation:none}}
@keyframes hdTools{from{transform:translateX(0)}to{transform:translateX(-50%)}}
.hd-tools{animation:hdTools 80s linear infinite}
@media (prefers-reduced-motion: reduce){.hd-tools{animation:none}}
@keyframes hdOp{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
.hd-chip{display:inline-flex;align-items:center;height:42px;padding:0 18px;border-radius:999px;border:1px solid #C9C3BA;font-size:16px;letter-spacing:-0.01em;color:#17181B;background:rgba(255,255,255,0.35);transition:background .3s ease,border-color .3s ease}
.hd-chip:hover{background:#FFFFFF;border-color:#FFFFFF}
@keyframes hdFade{from{opacity:0}to{opacity:1}}
@keyframes hdPop{from{opacity:0;transform:translateY(24px) scale(.97)}to{opacity:1;transform:none}}
</style>
<script src="dc-lite.js"></script>
<script src="smooth.js" defer></script>

        <img src="assets/mw-cowboy-hat-6c836f.jpg" alt="" style="display: block; flex-shrink: 0; width: 180px; height: 238px; border-radius: 12px; object-fit: cover; object-position: 50% 50%;">

        <img src="assets/cotera-bench-b7d2eb.jpg" alt="" style="display: block; flex-shrink: 0; width: 216px; height: 216px; border-radius: 12px; object-fit: cover; object-position: 50% 50%;">

    <!-- INTRO -->
    <section style="position: relative; height: 960px; background: {{ground}};">
      <p style="position: absolute; left: 40px; top: 90px; width: 820px; margin: 0; font-size: 42px; line-height: 1.1; font-weight: 400; letter-spacing: -0.04em;">My work: brands, live experiences and partnerships for companies that would rather be <span style="color: {{hi}}; background-image: {{hiGrad}}; -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: {{hiFill}};">remembered</span> than noticed.</p>
      <p style="position: absolute; left: 960px; top: 330px; width: 400px; margin: 0; font-size: 17px; line-height: 1.55; color: #3A3A3A;">I currently lead marketing end to end across six brands, from strategy and brand to web, events, MarTech and AI, and I’ve built and led the team behind it. I bring the <span style="color: {{hiSmall}};">creative vision</span> and the <span style="color: {{hiSmall}};">follow-through</span>, and I care whether it actually worked.</p>
      <img src="assets/head-3-f8c985.jpg" alt="Heidi Dains smiling, chin resting on her hand" style="position: absolute; left: 40px; top: 330px; width: 420px; height: 560px; border-radius: 16px; object-fit: cover; object-position: 50% 30%;">
    </section>

    <!-- APPROACH: full-bleed photo band -->
    <section id="hd-mx" style="position: relative; height: 720px; overflow: hidden; background: #1A1513;">

      <span aria-hidden="true" style="position: absolute; inset: 0; background: linear-gradient(90deg, rgba(20,16,14,0.86) 0%, rgba(20,16,14,0.62) 42%, rgba(20,16,14,0.12) 100%);"></span>
      <div style="position: absolute; left: 120px; top: 50%; width: 640px; transform: translateY(-50%); color: #F3F1EC;">
        <span style="font-family: 'IBM Plex Mono', ui-monospace, Menlo, monospace; font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: {{sand}}; background-image: {{sandGrad}}; -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: {{sandFill}};">Approach</span>
        <p style="margin: 22px 0 0; font-size: 48px; line-height: 1.1; font-weight: 400; letter-spacing: -0.04em;"><span style="color: {{sand}}; background-image: {{sandGrad}}; -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: {{sandFill}};">Big ideas, obsessive details,</span> and the follow-through to make them real. Even at the dang 6 a.m. load-in.</p>

      <span style="position: absolute; right: 40px; bottom: 32px; font-size: 14px; color: rgba(243,241,236,0.78);">The kind of 6 a.m. load-in I’m talking about.</span>

    <!-- HOW I OPERATE: pinned scroll list -->
    <section id="hd-ops" style="position: relative; height: 2300px; background: {{ground}};">
      <div style="position: sticky; top: 0; height: 900px; overflow: hidden;">
        <span style="position: absolute; left: 120px; top: 120px; font-family: 'IBM Plex Mono', ui-monospace, Menlo, monospace; font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: #6D6A66;">How I operate</span>

            <span style="font-family: 'IBM Plex Mono', ui-monospace, Menlo, monospace; font-size: 13px; width: 26px;">02</span>

            <span style="font-family: 'IBM Plex Mono', ui-monospace, Menlo, monospace; font-size: 13px; width: 26px;">03</span>
            <span style="font-size: 62px; line-height: 1; letter-spacing: -0.05em;">Create</span>
          </button>
          <button type="button" onClick="{{toggleOp4}}" aria-current="{{op4}}" style="display: flex; align-items: baseline; gap: 20px; height: 74px; padding: 0; border: none; background: none; cursor: pointer; font-family: 'Host Grotesk', sans-serif; text-align: left; color: {{opCol4}}; transition: color .35s ease;">
            <span style="font-family: 'IBM Plex Mono', ui-monospace, Menlo, monospace; font-size: 13px; width: 26px;">04</span>
            <span style="font-size: 62px; line-height: 1; letter-spacing: -0.05em;">Operate</span>
          </button>
          <button type="button" onClick="{{toggleOp5}}" aria-current="{{op5}}" style="display: flex; align-items: baseline; gap: 20px; height: 74px; padding: 0; border: none; background: none; cursor: pointer; font-family: 'Host Grotesk', sans-serif; text-align: left; color: {{opCol5}}; transition: color .35s ease;">
            <span style="font-family: 'IBM Plex Mono', ui-monospace, Menlo, monospace; font-size: 13px; width: 26px;">05</span>
            <span style="font-size: 62px; line-height: 1; letter-spacing: -0.05em;">Amplify</span>
          </button>
          <button type="button" onClick="{{toggleOp6}}" aria-current="{{op6}}" style="display: flex; align-items: baseline; gap: 20px; height: 74px; padding: 0; border: none; background: none; cursor: pointer; font-family: 'Host Grotesk', sans-serif; text-align: left; color: {{opCol6}}; transition: color .35s ease;">
            <span style="font-family: 'IBM Plex Mono', ui-monospace, Menlo, monospace; font-size: 13px; width: 26px;">06</span>

        <div style="position: absolute; left: 150px; top: 760px; width: 380px; height: 2px; border-radius: 2px; background: #D5D0C8; overflow: hidden;"><span style="display: block; width: 100%; height: 100%; background: {{sandBg}}; transform-origin: 0 50%; transform: scaleX({{opProg}}); transition: transform .2s linear;"></span></div>
        <div style="position: absolute; left: 760px; top: 318px; width: 560px; height: 420px;">
        <sc-if value="{{op1}}" hint-placeholder-val="{{ false }}">
          <div style="position: absolute; inset: 0; display: flex; flex-direction: column; animation: hdOp .55s cubic-bezier(.2,.75,.1,1) both;">
            <span style="font-family: 'IBM Plex Mono', ui-monospace, Menlo, monospace; font-size: 12px; letter-spacing: 0.08em; color: {{hiSmall}};">01 / 06 · STRATEGIZE</span>

              <span style="display: flex; gap: 14px; padding: 16px 0; border-top: 1px solid #D5D0C8; font-size: 18px; line-height: 1.45; color: #2A2A2A;"><span aria-hidden="true" style="color: {{hi}}; background-image: {{hiGrad}}; -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: {{hiFill}};">✦</span>Brand strategy across six brands at SMS</span>
            </div>
          </div>
        </sc-if>
        <sc-if value="{{op2}}" hint-placeholder-val="{{ false }}">
          <div style="position: absolute; inset: 0; display: flex; flex-direction: column; animation: hdOp .55s cubic-bezier(.2,.75,.1,1) both;">
            <span style="font-family: 'IBM Plex Mono', ui-monospace, Menlo, monospace; font-size: 12px; letter-spacing: 0.08em; color: {{hiSmall}};">02 / 06 · BUILD</span>
            <p style="margin: 18px 0 30px; font-size: 38px; line-height: 1.12; letter-spacing: -0.035em;">Websites, built with my own hands.</p>

              <span style="display: flex; gap: 14px; padding: 16px 0; border-top: 1px solid #D5D0C8; font-size: 18px; line-height: 1.45; color: #2A2A2A;"><span aria-hidden="true" style="color: {{hi}}; background-image: {{hiGrad}}; -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: {{hiFill}};">✦</span>The SMS site in HubSpot CMS, HubDB and HTML/CSS</span>
              <span style="display: flex; gap: 14px; padding: 16px 0; border-top: 1px solid #D5D0C8; font-size: 18px; line-height: 1.45; color: #2A2A2A;"><span aria-hidden="true" style="color: {{hi}}; background-image: {{hiGrad}}; -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: {{hiFill}};">✦</span>RSA’s site, designed and launched on Squarespace</span>

        <sc-if value="{{op3}}" hint-placeholder-val="{{ false }}">

              <span style="display: flex; gap: 14px; padding: 16px 0; border-top: 1px solid #D5D0C8; font-size: 18px; line-height: 1.45; color: #2A2A2A;"><span aria-hidden="true" style="color: {{hi}}; background-image: {{hiGrad}}; -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: {{hiFill}};">✦</span>Coterra, my own brand, from the name up</span>
            </div>
          </div>
        </sc-if>
        <sc-if value="{{op4}}" hint-placeholder-val="{{ false }}">
          <div style="position: absolute; inset: 0; display: flex; flex-direction: column; animation: hdOp .55s cubic-bezier(.2,.75,.1,1) both;">
            <span style="font-family: 'IBM Plex Mono', ui-monospace, Menlo, monospace; font-size: 12px; letter-spacing: 0.08em; color: {{hiSmall}};">04 / 06 · OPERATE</span>
