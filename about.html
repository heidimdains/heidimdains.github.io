<style>
.hd-soc{transition:background .25s ease,color .25s ease}.hd-soc:hover{opacity:1;background:rgba(255,255,255,0.16)}
#hd-layer{pointer-events:none}#hd-layer>*{pointer-events:auto}#hd-layer>[aria-hidden="true"]{pointer-events:none}
html,body{overscroll-behavior:none;margin:0;background:#EBE9E5;overflow-x:clip}
body{font-family:'Host Grotesk','Helvetica Neue',Helvetica,Arial,sans-serif;color:#17181B;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}a:hover{opacity:.8}
a:focus-visible,button:focus-visible{outline:2px solid #17181B;outline-offset:3px}
@keyframes hdRise{from{transform:translateY(50px);opacity:0}to{transform:none;opacity:1}}
@keyframes marquee{from{transform:translateX(0)}to{transform:translateX(-50%)}}
.hd-rise{animation:hdRise 1.2s cubic-bezier(.2,.75,.1,1) both}
.hd-d1{animation-delay:.15s}.hd-d2{animation-delay:.3s}
.marquee{animation:marquee 70s linear infinite}
.marquee-wrap:hover .marquee{animation-play-state:paused}
@media (prefers-reduced-motion: reduce){.hd-rise,.marquee{animation:none}}
@keyframes hdTools{from{transform:translateX(0)}to{transform:translateX(-50%)}}
.hd-tools{animation:hdTools 80s linear infinite}
@media (prefers-reduced-motion: reduce){.hd-tools{animation:none}}
@keyframes hdOp{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
.hd-trow{overflow:hidden;padding:7px 0;-webkit-mask-image:linear-gradient(90deg,transparent 0,#000 12%,#000 88%,transparent 100%);mask-image:linear-gradient(90deg,transparent 0,#000 12%,#000 88%,transparent 100%)}
.hd-tl{display:flex;gap:14px;width:max-content}
.hd-tl-a{animation:hdToolsA 48s linear infinite}.hd-tl-b{animation:hdToolsB 56s linear infinite}
.hd-trow:hover .hd-tl{animation-play-state:paused}
@keyframes hdToolsA{from{transform:translateX(0)}to{transform:translateX(calc(-50% - 7px))}}
@keyframes hdToolsB{from{transform:translateX(calc(-50% - 7px))}to{transform:translateX(0)}}
.hd-tool{display:inline-flex;align-items:center;gap:12px;height:62px;padding:0 26px 0 20px;border-radius:999px;background:#F7F4EF;border:1px solid #DCD5CB;color:#2A2A2A;font-size:18px;letter-spacing:-0.01em;white-space:nowrap;transition:background .3s ease,color .3s ease,border-color .3s ease}
.hd-tool:hover{background:{{panel}};border-color:{{panel}};color:#F3F1EC}
@media (prefers-reduced-motion: reduce){.hd-tl-a,.hd-tl-b{animation:none}}
.hd-chip{display:inline-flex;align-items:center;height:42px;padding:0 18px;border-radius:999px;border:1px solid #C9C3BA;font-size:16px;letter-spacing:-0.01em;color:#17181B;background:rgba(255,255,255,0.35);transition:background .3s ease,border-color .3s ease}
.hd-chip:hover{background:#FFFFFF;border-color:#FFFFFF}
@keyframes hdFade{from{opacity:0}to{opacity:1}}
@keyframes hdPop{from{opacity:0;transform:translateY(24px) scale(.97)}to{opacity:1;transform:none}}
</style>
<script src="dc-lite.js"></script>
<script src="smooth.js" defer></script>

    <!-- INTRO -->
    <section style="position: relative; height: 960px; background: {{ground}};">
      <p style="position: absolute; left: 40px; top: 90px; width: 820px; margin: 0; font-size: 42px; line-height: 1.1; font-weight: 400; letter-spacing: -0.04em;">My work: brands, live experiences and partnerships for companies that would rather be <span style="color: {{hi}}; background-image: {{hiGrad}}; -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: {{hiFill}};">remembered</span> than noticed.</p>
      <p style="position: absolute; left: 960px; top: 330px; width: 400px; margin: 0; font-size: 17px; line-height: 1.55; color: #3A3A3A;">I currently lead marketing end to end across six brands, from strategy and brand to web, events, MarTech and AI, and I’ve built and led the team behind it. I bring the <span style="color: {{hiSmall}};">creative vision</span> and the <span style="color: {{hiSmall}};">follow-through</span>, and I care whether it actually worked.</p>

        <div style="position: absolute; left: 760px; top: 318px; width: 560px; height: 420px;">
        <sc-if value="{{op1}}" hint-placeholder-val="{{ false }}">

        <sc-if value="{{op4}}" hint-placeholder-val="{{ false }}">
