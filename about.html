      <p style="margin: 28px 0 0; max-width: 1200px; font-size: 62px; line-height: 1.1; font-weight: 400; letter-spacing: -0.042em;">Raised in Pittsburgh around motocross <img src="assets/moto-finish-wide-bw-949d5a.jpg" alt="Heidi with arms raised on a Supercross track, under the finish line at Gillette Stadium" style="display: inline-block; width: 150px; height: 84px; border-radius: 999px; object-fit: cover; object-position: 50% 60%; vertical-align: -12px;">, so playing it safe <span style="color: {{hi}}; background-image: {{hiGrad}}; -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: {{hiFill}};">never quite took.</span> Now I run marketing from Charleston for a six-brand portfolio.</p>
      <div style="position: absolute; left: 6%; right: 6%; top: 640px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 48px; padding-top: 22px; border-top: 1px solid #C9C6C0;">

          <span style="font-size: 20px; font-weight: 500; letter-spacing: -0.01em;">Strategic Maintenance Solutions</span>
          <span style="font-size: 16px; line-height: 1.5; color: #4A4A48;">Marketing Manager and department lead. Brand, experiential, digital, partnerships, and now an acquisition to fold in.</span>
        </div>
        <div style="display: flex; flex-direction: column; gap: 8px;">
          <span style="font-family: 'IBM Plex Mono', ui-monospace, Menlo, monospace; font-size: 12px; color: #6D6A66;">2022 — 2024</span>
