<style>
html,body{margin:0;background:#EBE9E5;overflow-x:clip}
body{font-family:'Host Grotesk','Helvetica Neue',Helvetica,Arial,sans-serif;color:#17181B;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}a:hover{opacity:.72}
a:focus-visible,button:focus-visible{outline:2px solid #17181B;outline-offset:3px}
@keyframes hdRise{from{transform:translateY(60px);opacity:0}to{transform:none;opacity:1}}
@keyframes hdUp{from{transform:translateY(120px);opacity:0}to{transform:none;opacity:1}}
.hd-rise{animation:hdRise 1.2s cubic-bezier(.2,.75,.1,1) both}
.hd-d1{animation-delay:.12s}.hd-d2{animation-delay:.24s}.hd-d3{animation-delay:.5s}
.hd-up{animation:hdUp 1.4s cubic-bezier(.2,.75,.1,1) .2s both}
@keyframes kbA{from{transform:scale(1.03) translate(0,0)}to{transform:scale(1.16) translate(-3%,-2%)}}
@keyframes kbB{from{transform:scale(1.15) translate(3%,2%)}to{transform:scale(1.03) translate(-1%,-1%)}}
@keyframes kbC{from{transform:scale(1.06) translate(-2%,2%)}to{transform:scale(1.18) translate(2%,-2%)}}
@keyframes shotScroll{0%,10%{object-position:50% 0%}90%,100%{object-position:50% 100%}}
@keyframes bob{from{transform:translateY(0)}to{transform:translateY(-14px)}}
.kbA{animation:kbA 11s ease-in-out infinite alternate}
.kbB{animation:kbB 13s ease-in-out infinite alternate}
.kbC{animation:kbC 9s ease-in-out infinite alternate}
.shot{animation:shotScroll 9s ease-in-out infinite alternate}
.bob1{animation:bob 5s ease-in-out infinite alternate}
.bob2{animation:bob 6.5s ease-in-out -2s infinite alternate}
.bob3{animation:bob 5.8s ease-in-out -4s infinite alternate}
@media (prefers-reduced-motion: reduce){.hd-rise,.hd-up,.kbA,.kbB,.kbC,.shot,.bob1,.bob2,.bob3{animation:none}}
@keyframes hdFade{from{opacity:0}to{opacity:1}}
@keyframes hdPop{from{opacity:0;transform:translateY(24px) scale(.97)}to{opacity:1;transform:none}}
</style>
<script src="dc-lite.js"></script>
</head>

      <p style="margin: 28px 0 0; max-width: 1200px; font-size: 62px; line-height: 1.1; font-weight: 400; letter-spacing: -0.042em;">Raised in Pittsburgh around motocross <img src="assets/moto-finish-wide-bw-949d5a.jpg" alt="Heidi with arms raised on a Supercross track, under the finish line at Gillette Stadium" style="display: inline-block; width: 150px; height: 84px; border-radius: 999px; object-fit: cover; object-position: 50% 60%; vertical-align: -12px;">, so playing it safe <span style="color: {{hi}}; background-image: {{hiGrad}}; -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: {{hiFill}};">never quite took.</span> Now I run marketing from Charleston for a five-brand portfolio.</p>

<script>
class Component extends DCLogic {
  componentDidMount() {
    this._hdKey = (e) => { if (e.key === 'Escape' && this.state && this.state.contactOpen) this.setState({ contactOpen: false }); };
    window.addEventListener('keydown', this._hdKey);
    this._raf = 0;
    this._tick = () => {
      if (this._raf) return;
      this._raf = requestAnimationFrame(() => { this._raf = 0; this.measure(); });
    };
    window.addEventListener('scroll', this._tick, { passive: true });
    window.addEventListener('resize', this._tick);
    this.measure();
    setTimeout(() => this.measure(), 400);
    document.querySelectorAll('video').forEach(v => { v.muted = true; const p = v.play && v.play(); if (p && p.catch) p.catch(() => {}); });
  }
  componentWillUnmount() {
    window.removeEventListener('keydown', this._hdKey);
    window.removeEventListener('scroll', this._tick);
    window.removeEventListener('resize', this._tick);
    if (this._raf) cancelAnimationFrame(this._raf);
  }
  measure() {
    const vh = window.innerHeight;
    const z = Math.min(1.3, Math.max(0.3, window.innerWidth / 1440));
    if (Math.abs(z - ((this.state && this.state.zoom) || 1)) > 0.001) {
      this.setState({ zoom: z });
      setTimeout(() => this.measure(), 50);
      return;
    }
    const vw = 1440;
    const doc = document.documentElement;
    const canScroll = doc.scrollHeight > vh + 4;
    const work = document.getElementById('hd-work');
    const track = document.getElementById('hd-track');
    const pill = document.getElementById('hd-pill');
    let p = 0.34, hp = 0, pp = 1;
    if (canScroll && work) {
      const r = work.getBoundingClientRect();
      const total = Math.max(1, r.height - vh);
      p = Math.min(1, Math.max(0, -r.top / total));
      hp = Math.min(1, Math.max(0, window.scrollY / (900 * z)));
      if (pill) {
        const pr = pill.getBoundingClientRect();
        pp = Math.min(1, Math.max(0, (vh - pr.top) / (vh * 0.85)));
      }
    }
    const stmt = document.getElementById('hd-statement');
    let sT = 1;
    if (stmt) { const sr = stmt.getBoundingClientRect(); sT = Math.min(1, Math.max(0, (vh * 1.05 - sr.top) / (vh * 0.5))); }
    const tw = (track ? track.scrollWidth : 4800) - 200;
    const k = 0.72;
    const start = vw * 0.9;
    const end = vw * 0.9 - tw * k;
    this.setState({
      trackX: Math.round(start + (end - start) * p),
      heroY: Math.round(hp * -80),
      heroFade: (1 - hp * 0.4).toFixed(3),
      pillScale: (0.8 + 0.2 * pp).toFixed(3),
      stmtT: sT
    });
  }
  renderVals() {
    const s = this.state || {};
    const P = {
      'Twilight': { panel: '#2A211C', sand: '#E9A0B4', grad: 'linear-gradient(100deg, #F6A77E 0%, #E27FA0 50%, #A98BDB 100%)', hi: '#8A4A86', ground: '#ECE7DF', panelMuted: '#DDD3C6', panelMuted2: '#BFB3A3' },
      'Plum Dusk': { panel: '#2A211C', sand: '#E28AAE', grad: 'linear-gradient(100deg, #F4B79C 0%, #E28AAE 33%, #B395E0 67%, #7A56B0 100%)', hi: '#74428A', ground: '#ECE7DF', panelMuted: '#DDD3C6', panelMuted2: '#BFB3A3' },
      'Berry Hour': { panel: '#2A211C', sand: '#E17EA0', grad: 'linear-gradient(100deg, #F4B79C 0%, #E17EA0 50%, #C8B7EA 100%)', hi: '#9C3F66', ground: '#ECE7DF', panelMuted: '#DDD3C6', panelMuted2: '#BFB3A3' },
      'Dusk': { panel: '#2A211C', sand: '#E9B3C4', grad: 'linear-gradient(100deg, #F4B79C 0%, #E9B3C4 33%, #C8B7EA 67%, #9474CC 100%)', hi: '#7E4E86', ground: '#ECE7DF', panelMuted: '#DDD3C6', panelMuted2: '#BFB3A3' },
      'Rose Ember': { panel: '#2A211C', sand: '#F4B79C', grad: 'linear-gradient(100deg, #E9845F 0%, #F4B79C 33%, #E9B3C4 67%, #C8B7EA 100%)', hi: '#A3474F', ground: '#ECE7DF', panelMuted: '#DDD3C6', panelMuted2: '#BFB3A3' },
      'Tequila Sunrise': { panel: '#2A211C', sand: '#F4A06A', grad: 'linear-gradient(100deg, #FBD56B 0%, #F7994E 33%, #EE6570 67%, #F08BB0 100%)', hi: '#B8483F', ground: '#ECE7DF', panelMuted: '#DDD3C6', panelMuted2: '#BFB3A3' },
      'Sunset Pop': { panel: '#2A211C', sand: '#F4894D', grad: 'linear-gradient(100deg, #F8C25C 0%, #F4894D 50%, #EF6F91 100%)', hi: '#B8483F', ground: '#ECE7DF', panelMuted: '#DDD3C6', panelMuted2: '#BFB3A3' },
      'Peach Sorbet': { panel: '#2A211C', sand: '#F5A27A', grad: 'linear-gradient(100deg, #F9CB7C 0%, #F5A27A 50%, #EF89A6 100%)', hi: '#A9505A', ground: '#ECE7DF', panelMuted: '#DDD3C6', panelMuted2: '#BFB3A3' },
      'Desert Bloom': { panel: '#2A211C', sand: '#F2C66D', grad: 'linear-gradient(100deg, #A9C29A 0%, #F2C66D 33%, #F08462 67%, #EC7FA0 100%)', hi: '#A94B45', ground: '#ECE7DF', panelMuted: '#DDD3C6', panelMuted2: '#BFB3A3' },
      'Golden Hour': { panel: '#2A211C', sand: '#EDBBB0', grad: 'linear-gradient(100deg, #F4B79C 0%, #E9B3C4 50%, #C8B7EA 100%)', hi: '#A8486F', hiSmall: '#A8486F', hiGrad: 'linear-gradient(100deg, #C8704E 0%, #B8567E 50%, #7D63BA 100%)', ground: '#ECE7DF', panelMuted: '#DDD3C6', panelMuted2: '#BFB3A3' },
      'Espresso & Brass': { panel: '#2A211C', sand: '#D8B272', hi: '#8A6427', ground: '#ECE7DF', panelMuted: '#DDD3C6', panelMuted2: '#BFB3A3' },
      'Moto': { panel: '#141414', sand: '#FF5A1F', hi: '#C8430E', ground: '#ECEBE8', panelMuted: '#D6D2CB', panelMuted2: '#A8A39B' },
      'Oxblood & Blush': { panel: '#4E1B22', sand: '#F3BFAE', hi: '#8E2F3A', ground: '#EEE8E4', panelMuted: '#EBD3CE', panelMuted2: '#CBA8A4' },
      'Desert Clay': { panel: '#94442A', sand: '#F4E4CC', hi: '#94442A', ground: '#EEE6DC', panelMuted: '#F4DCCB', panelMuted2: '#E6C0A8' }
    };
    const pal0 = P[this.props.palette] || P['Golden Hour'];
    const pal = { ...pal0, hiSmall: pal0.hiSmall || pal0.hi, hiGrad: pal0.hiGrad || 'none', hiFill: pal0.hiGrad ? 'transparent' : 'currentColor', sandBg: pal0.grad || pal0.sand, sandGrad: pal0.grad || 'none', sandFill: pal0.grad ? 'transparent' : 'currentColor' };
    const hx = (h) => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
    const mix = (a, b, t) => { const A = hx(a), B = hx(b); return 'rgb(' + A.map((v, i) => Math.round(v + (B[i] - v) * t)).join(',') + ')'; };
    const sT = s.stmtT ?? 1;
    return {
      ...pal,
      stmtBg: mix(pal.panel, pal.ground, sT),
      stmtFg: sT < 0.45 ? '#F3F1EC' : '#17181B',
      stmtMuted: sT < 0.45 ? '#BFB3A3' : '#6D6A66',
      contactOpen: !!s.contactOpen,
      contactSent: !!s.contactSent,
      contactForm: !s.contactSent,
      openContact: (e) => { if (e && e.preventDefault) e.preventDefault(); this._cEmail = ''; this._cMsg = ''; this.setState({ contactOpen: true, contactSent: false }); },
      closeContact: () => this.setState({ contactOpen: false }),
      setContactEmail: (e) => { this._cEmail = e.target.value; },
      setContactMsg: (e) => { this._cMsg = e.target.value; },
      sendContact: () => {
        const body = (this._cMsg || '') + (this._cEmail ? '\n\nReply to: ' + this._cEmail : '');
        const url = 'mailto:heidimdains@gmail.com?subject=' + encodeURIComponent('Hello from your portfolio') + '&body=' + encodeURIComponent(body);
        try { window.location.href = url; } catch (err) {}
        this.setState({ contactSent: true });
      },
      zoom: s.zoom ?? 1,
      trackX: s.trackX ?? -700,
      heroY: s.heroY ?? 0,
      heroFade: s.heroFade ?? 1,
      pillScale: s.pillScale ?? 1,
      copyLabel: s.copied ? 'Copied' : 'Copy',
      copyEmail: () => {
        const done = () => this.setState({ copied: true });
        try {
          const w = navigator.clipboard && navigator.clipboard.writeText('heidimdains@gmail.com');
          if (w && w.then) w.then(done).catch(() => {}); else done();
        } catch (e) {}
      }
    };
  }
}
dcMount(Component, {"palette": "Golden Hour"});
